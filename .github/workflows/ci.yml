name: CI Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'tests/**'
      - 'main.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'Dockerfile'
      - '.github/workflows/ci.yml'

# Least privilege permissions
permissions:
  contents: read

# Prevent concurrent CI runs for the same branch  
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Cache Python dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint Python sources with Ruff
        run: |
          echo "Running Ruff linter..."
          ruff check app tests main.py --output-format=github
      
      - name: Check Python formatting
        run: |
          echo "Checking code formatting..."
          ruff format --check app tests main.py
      
      - name: Type check with mypy (if available)
        continue-on-error: true
        run: |
          if pip show mypy > /dev/null 2>&1; then
            echo "Running mypy type checker..."
            mypy app --ignore-missing-imports || true
          else
            echo "mypy not installed, skipping type checks"
          fi

      - name: Compile Python bytecode
        run: |
          echo "Compiling Python sources..."
          python -m compileall -q app tests main.py

      - name: Verify application imports
        run: |
          echo "Testing application import..."
          python -c "from main import app; print(f'✓ Application loaded: {app.title}')"

      - name: Run test suite
        run: |
          echo "Running pytest..."
          pytest -v --tb=short --color=yes

      - name: Security audit dependencies
        continue-on-error: true
        run: |
          echo "Running pip-audit security scan..."
          pip-audit -r requirements.txt --desc --format json > audit-results.json || true
          if [ -f audit-results.json ]; then
            cat audit-results.json
          fi
  
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      
      - name: Dependency Review
        uses: actions/dependency-review-action@4081bf99e2866ebe428fc0477b69eb4fcda7220a # v4.5.0
        with:
          fail-on-severity: moderate
  
  docker-build:
    name: Docker Build and Security Scan
    runs-on: ubuntu-latest
    needs: python-quality
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      
      - name: Build container image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: email-assistant:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@f781cce5aab226378ee181d764ab90ea0be3cdd8 # 0.29.0
        with:
          image-ref: email-assistant:ci-${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      
      - name: Test container startup
        run: |
          echo "Testing container startup..."
          docker run --rm -d --name test-container -p 8000:8000 email-assistant:ci-${{ github.sha }}
          sleep 5
          
          # Check health endpoint
          curl -f http://localhost:8000/health || exit 1
          echo "✓ Container health check passed"
          
          docker stop test-container