name: deploy-to-azure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: 'Target Azure resource group override (optional)'
        required: false
        default: ''
      image_repository:
        description: 'Container image repository name (optional)'
        required: false
        default: 'email-assistant'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-email-assistant-${{ github.ref }}
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ github.event.inputs.resource_group || vars.AZURE_RESOURCE_GROUP || 'rg-sandbox' }}
  ACR_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
  IMAGE_REPOSITORY: ${{ github.event.inputs.image_repository || vars.IMAGE_REPOSITORY || 'email-assistant' }}
  BICEP_TEMPLATE: infra/main.bicep
  BICEP_PARAMETERS: infra/dev.bicepparam

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify required configuration
        run: |
          test -n "$RESOURCE_GROUP"
          test -n "$ACR_NAME"
          test -n "$ACR_LOGIN_SERVER"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Compute image tag
        id: image
        run: echo "tag=$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tag }}

      - name: Upgrade Bicep CLI
        run: az bicep upgrade

      - name: Validate deployment
        run: |
          az deployment group validate \
            --name email-assistant-${GITHUB_RUN_ID}-validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$BICEP_TEMPLATE" \
            --parameters "$BICEP_PARAMETERS" \
            --parameters containerImage="${{ steps.image.outputs.tag }}" containerRegistryName="$ACR_NAME" \
            --only-show-errors

      - name: What-if preview
        run: |
          az deployment group what-if \
            --name email-assistant-${GITHUB_RUN_ID}-whatif \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$BICEP_TEMPLATE" \
            --parameters "$BICEP_PARAMETERS" \
            --parameters containerImage="${{ steps.image.outputs.tag }}" containerRegistryName="$ACR_NAME" \
            --result-format FullResourcePayloads \
            --only-show-errors

      - name: Deploy infrastructure and app
        run: |
          az deployment group create \
            --name email-assistant-${GITHUB_RUN_ID} \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$BICEP_TEMPLATE" \
            --parameters "$BICEP_PARAMETERS" \
            --parameters containerImage="${{ steps.image.outputs.tag }}" containerRegistryName="$ACR_NAME" \
            --only-show-errors