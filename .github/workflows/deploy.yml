name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: 'Azure Subscription ID'
        required: true
        type: string
      client_id:
        description: 'Azure Client ID (Service Principal)'
        required: true
        type: string
      tenant_id:
        description: 'Azure Tenant ID'
        required: true
        type: string
      resource_group:
        description: 'Target Azure resource group'
        required: false
        default: 'rg-email-assistant'
        type: string
      location:
        description: 'Azure region for resources'
        required: false
        default: 'eastus'
        type: string
      acr_name:
        description: 'Azure Container Registry name (must be globally unique)'
        required: false
        default: 'acremailassistant'
        type: string
      image_repository:
        description: 'Container image repository name'
        required: false
        default: 'email-assistant'
        type: string
      environment:
        description: 'Deployment environment'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - dev

# Least privilege permissions - OIDC for Azure login
permissions:
  contents: read
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SUBSCRIPTION_ID: ${{ github.event.inputs.subscription_id }}
  CLIENT_ID: ${{ github.event.inputs.client_id }}
  TENANT_ID: ${{ github.event.inputs.tenant_id }}
  RESOURCE_GROUP: ${{ github.event.inputs.resource_group || 'rg-email-assistant' }}
  LOCATION: ${{ github.event.inputs.location || 'eastus' }}
  ACR_NAME: ${{ github.event.inputs.acr_name || 'acremailassistant' }}
  IMAGE_REPOSITORY: ${{ github.event.inputs.image_repository || 'email-assistant' }}
  BICEP_TEMPLATE: infra/main.bicep
  BICEP_PARAMETERS: infra/dev.bicepparam

jobs:
  provision-infrastructure:
    name: Provision Azure Infrastructure
    runs-on: ubuntu-latest
    
    outputs:
      acr-login-server: ${{ steps.acr.outputs.login-server }}
      resource-group-created: ${{ steps.rg.outputs.created }}
      acr-created: ${{ steps.acr.outputs.created }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Log in to Azure with OIDC
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}
      
      - name: Set Azure subscription context
        run: |
          echo "Setting subscription context..."
          az account set --subscription "$SUBSCRIPTION_ID"
          az account show --output table
          echo "✓ Subscription context set"
      
      - name: Create or verify resource group
        id: rg
        run: |
          echo "Checking resource group: $RESOURCE_GROUP"
          
          if az group show --name "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "✓ Resource group already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating resource group: $RESOURCE_GROUP in $LOCATION"
            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --tags \
                "environment=${{ github.event.inputs.environment || 'production' }}" \
                "managed-by=github-actions" \
                "repository=${{ github.repository }}" \
              --output table
            echo "✓ Resource group created successfully"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Create or verify Azure Container Registry
        id: acr
        run: |
          echo "Checking Azure Container Registry: $ACR_NAME"
          
          if az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "✓ ACR already exists"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating ACR: $ACR_NAME"
            az acr create \
              --name "$ACR_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --sku Standard \
              --admin-enabled false \
              --tags \
                "environment=${{ github.event.inputs.environment || 'production' }}" \
                "managed-by=github-actions" \
              --output table
            echo "✓ ACR created successfully"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          
          # Get login server
          LOGIN_SERVER=$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer -o tsv)
          echo "login-server=$LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "✓ ACR Login Server: $LOGIN_SERVER"
      
      - name: Configure ACR for Container Apps
        run: |
          echo "Configuring ACR for Container Apps integration..."
          
          # Enable admin user temporarily for Container Apps (will use managed identity later)
          az acr update \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --admin-enabled true \
            --output none
          
          echo "✓ ACR configured for Container Apps"
      
      - name: Infrastructure provisioning summary
        run: |
          echo "### Infrastructure Provisioning Summary ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Subscription:** \`$SUBSCRIPTION_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** \`$RESOURCE_GROUP\` $(if [ "${{ steps.rg.outputs.created }}" = "true" ]; then echo "(newly created)"; else echo "(existing)"; fi)" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** \`$LOCATION\`" >> $GITHUB_STEP_SUMMARY
          echo "**ACR Name:** \`$ACR_NAME\` $(if [ "${{ steps.acr.outputs.created }}" = "true" ]; then echo "(newly created)"; else echo "(existing)"; fi)" >> $GITHUB_STEP_SUMMARY
          echo "**ACR Login Server:** \`${{ steps.acr.outputs.login-server }}\`" >> $GITHUB_STEP_SUMMARY

  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    needs: provision-infrastructure
    
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      
      - name: Validate configuration
        run: |
          echo "### Validation Results ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Subscription ID:** \`$SUBSCRIPTION_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "**Client ID:** \`$CLIENT_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tenant ID:** \`$TENANT_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** \`$RESOURCE_GROUP\`" >> $GITHUB_STEP_SUMMARY
          echo "**ACR Name:** \`$ACR_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "**ACR Login Server:** \`${{ needs.provision-infrastructure.outputs.acr-login-server }}\`" >> $GITHUB_STEP_SUMMARY
          echo "✓ All configuration validated"
  
  build-and-push:
    name: Build and Push Container Image
    runs-on: ubuntu-latest
    needs: [provision-infrastructure, validate]
    
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Log in to Azure with OIDC
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}
      
      - name: Verify Azure context
        run: |
          echo "Verifying Azure login and subscription..."
          az account set --subscription "$SUBSCRIPTION_ID"
          az account show --output table
          echo "✓ Successfully authenticated to Azure"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to Azure Container Registry
        run: |
          echo "Logging into ACR: $ACR_NAME"
          az acr login --name "$ACR_NAME"
          echo "✓ Successfully logged into ACR"

      - name: Compute image tags
        id: image
        run: |
          ACR_LOGIN_SERVER="${{ needs.provision-infrastructure.outputs.acr-login-server }}"
          
          # Primary tag with commit SHA
          echo "tag=$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          
          # Additional tags
          echo "latest-tag=$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:latest" >> "$GITHUB_OUTPUT"
          echo "run-tag=$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:run-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.latest-tag }}
            ${{ steps.image.outputs.run-tag }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=registry,ref=${{ steps.image.outputs.latest-tag }}
          cache-to: type=inline
          provenance: false
          sbom: false
      
      - name: Image build summary
        run: |
          echo "### Container Image Built Successfully ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.image.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
  
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [provision-infrastructure, build-and-push]
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      - name: Log in to Azure with OIDC
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ env.TENANT_ID }}
          subscription-id: ${{ env.SUBSCRIPTION_ID }}
      
      - name: Set Azure subscription context
        run: |
          az account set --subscription "$SUBSCRIPTION_ID"

      - name: Upgrade Bicep CLI
        run: |
          echo "Upgrading Bicep CLI..."
          az bicep upgrade
          az bicep version

      - name: Validate Bicep template
        run: |
          echo "Validating Bicep deployment..."
          az deployment group validate \
            --name email-assistant-${{ github.run_id }}-validate \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$BICEP_TEMPLATE" \
            --parameters "$BICEP_PARAMETERS" \
            --parameters containerImage="${{ needs.build-and-push.outputs.image-tag }}" \
            --parameters containerRegistryName="$ACR_NAME" \
            --only-show-errors
          echo "✓ Template validation passed"

      - name: Preview infrastructure changes (What-If)
        run: |
          echo "Running what-if analysis..."
          az deployment group what-if \
            --name email-assistant-${{ github.run_id }}-whatif \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$BICEP_TEMPLATE" \
            --parameters "$BICEP_PARAMETERS" \
            --parameters containerImage="${{ needs.build-and-push.outputs.image-tag }}" \
            --parameters containerRegistryName="$ACR_NAME" \
            --result-format FullResourcePayloads \
            --only-show-errors

      - name: Deploy infrastructure and application
        id: deployment
        run: |
          echo "Starting deployment..."
          DEPLOYMENT_NAME="email-assistant-${{ github.run_id }}"
          
          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file "$BICEP_TEMPLATE" \
            --parameters "$BICEP_PARAMETERS" \
            --parameters containerImage="${{ needs.build-and-push.outputs.image-tag }}" \
            --parameters containerRegistryName="$ACR_NAME" \
            --output json \
            --only-show-errors > deployment-output.json
          
          echo "✓ Deployment completed successfully"
          
          # Extract outputs
          CONTAINER_APP_URL=$(jq -r '.properties.outputs.containerAppUrl.value' deployment-output.json)
          CONTAINER_APP_NAME=$(jq -r '.properties.outputs.containerAppName.value' deployment-output.json)
          
          echo "url=$CONTAINER_APP_URL" >> "$GITHUB_OUTPUT"
          echo "app-name=$CONTAINER_APP_NAME" >> "$GITHUB_OUTPUT"
      
      - name: Wait for application readiness
        run: |
          APP_URL="${{ steps.deployment.outputs.url }}"
          if [[ "$APP_URL" != "Internal only" ]]; then
            echo "Waiting for application to become ready..."
            for i in {1..30}; do
              if curl -f -s "${APP_URL}/health" > /dev/null 2>&1; then
                echo "✓ Application is healthy and responding"
                exit 0
              fi
              echo "Attempt $i/30: Application not ready yet, waiting..."
              sleep 10
            done
            echo "⚠️ Application did not become ready within timeout"
            exit 1
          else
            echo "Application is internal-only, skipping health check"
          fi
      
      - name: Deployment summary
        run: |
          echo "### Deployment Summary ✓" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** \`$RESOURCE_GROUP\`" >> $GITHUB_STEP_SUMMARY
          echo "**Container App:** \`${{ steps.deployment.outputs.app-name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ needs.build-and-push.outputs.image-tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Get outputs from deployment
          if [ -f deployment-output.json ]; then
            echo "#### Deployment Outputs" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            jq '.properties.outputs' deployment-output.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi